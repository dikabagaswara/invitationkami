<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="35%" stop-color="#C59B46" />
      <stop offset="70%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#A27928" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="32" fill="url(#darkBg)" />

  <!-- Outer Botanical Leaf Ring -->
  <g stroke="url(#goldGradient)" fill="none" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <circle cx="250" cy="190" r="105" stroke-dasharray="4 8" stroke-width="1.5" />
    
    <!-- Leaves / Laurels -->
    <path d="M 250 80 C 235 95, 235 110, 250 120 C 265 110, 265 95, 250 80 Z" fill="url(#goldGradient)" opacity="0.9" />
    <path d="M 170 115 C 160 130, 168 142, 185 142 C 190 128, 180 118, 170 115 Z" fill="url(#goldGradient)" opacity="0.8" />
    <path d="M 330 115 C 340 130, 332 142, 315 142 C 310 128, 320 118, 330 115 Z" fill="url(#goldGradient)" opacity="0.8" />
    <path d="M 135 185 C 120 195, 122 210, 138 215 C 148 202, 142 190, 135 185 Z" fill="url(#goldGradient)" opacity="0.8" />
    <path d="M 365 185 C 380 195, 378 210, 362 215 C 352 202, 358 190, 365 185 Z" fill="url(#goldGradient)" opacity="0.8" />
    <path d="M 160 260 C 150 272, 158 285, 175 282 C 180 268, 170 258, 160 260 Z" fill="url(#goldGradient)" opacity="0.8" />
    <path d="M 340 260 C 350 272, 342 285, 325 282 C 320 268, 330 258, 340 260 Z" fill="url(#goldGradient)" opacity="0.8" />
  </g>

  <!-- Interlocking Wedding Rings -->
  <circle cx="218" cy="190" r="48" stroke="url(#goldGradient)" stroke-width="10" fill="none" />
  <circle cx="282" cy="190" r="48" stroke="url(#goldGradient)" stroke-width="10" fill="none" />
  <path d="M 250 151 A 48 48 0 0 1 250 229" stroke="url(#goldGradient)" stroke-width="10" fill="none" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text 
    x="250" 
    y="355" 
    text-anchor="middle" 
    fill="url(#goldGradient)" 
    font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
    font-size="32" 
    font-weight="700" 
    letter-spacing="4"
  >
    INVITATIONKAMI
  </text>

  <text 
    x="250" 
    y="390" 
    text-anchor="middle" 
    fill="#C5A059" 
    font-family="'Inter', 'Montserrat', 'Helvetica', sans-serif" 
    font-size="11" 
    font-weight="500" 
    letter-spacing="5" 
    opacity="0.9"
  >
    PREMIUM DIGITAL INVITATIONS
  </text>

  <!-- Established Year Badge -->
  <text 
    x="250" 
    y="428" 
    text-anchor="middle" 
    fill="#A27928" 
    font-family="'Inter', sans-serif" 
    font-size="11" 
    font-weight="600" 
    letter-spacing="3"
  >
    © 2026
  </text>

  <line x1="170" y1="424" x2="205" y2="424" stroke="url(#goldGradient)" stroke-width="1" opacity="0.5" />
  <line x1="295" y1="424" x2="330" y2="424" stroke="url(#goldGradient)" stroke-width="1" opacity="0.5" />
</svg>
